[package]
name = "decide"
version = "0.1.0"
edition = "2021"
description = "static site generator for the decide decision making tool"
license = "GPL-3.0-or-later"

[dependencies]
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[profile.release]
strip = true
