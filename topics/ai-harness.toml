#name = "AI Harness"

# every source is a primary one: the project's own documentation, its README,
# or, for dirac, the installed build. an aggregator's summary of a feature is
# not a source for it, so a row nobody has traced to the project itself is
# left uncited rather than cited to a comparison table.
#
# a source names the page and the heading or line it was read from, so a row
# can be rechecked without rereading the whole document.
#
# grading a capability by how far it is from working out of the box:
#   1.0 built in, on by default
#   0.7 built in, but off by default or needs configuring
#   0.5 built in, but partial or still landing
#   0.3 only through a plugin, adapter or proxy the project does not ship
#   0.0 not available

