	{ name = "Conversations", evaluations = [
		{ name = "Ad Funded", score = 0.0, comment = "", sources = ["https://conversations.im/", "\"Open Source: The entire source code of Conversations is publicly available on Codeberg and licensed under the GPLv3\", with no advertising surface"] },
		{ name = "E2EE", score = 1.0, comment = "OMEMO, or OpenPGP for those who prefer it.", sources = ["https://conversations.im/omemo/", "\"OMEMO is an XMPP Extension Protocol (XEP) for secure multi-client end-to-end encryption.\""] },
		{ name = "Always E2EE", score = 0.6, comment = "OMEMO is on by default for new chats, but a contact or room without it falls back to plain text.", sources = ["https://conversations.im/omemo/", "\"Turn it on once and forget you ever did.\": something turned on per conversation, not a property of the protocol"] },
