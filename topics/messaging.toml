# no phone number: 1.0 needs no number at all, 0.3 means one is needed to
# register but stays hidden from other users.
#
# foundation governed grades who answers for the operator, since a claim of
# independent governance is worth whatever the reader can check:
#
#   1.0 non-profit whose board is not the founder or the only funder
#   0.6 non-profit founded, funded and steered by its own founder
#   0.0 for-profit, whoever owns it
#
# third party servers is whether the operator lets you run your own, which
# is what makes the last two checkable rather than something to believe.
#
# a source is the operator's own page, or the specification where the row is
# about a protocol rather than an app, named down to the heading or the line
# it was read from. rows nobody has traced that far are left uncited.

# skip = true holds a draft out of the site: the loader drops it and fmt
# leaves it unfilled, so an unchecked candidate cannot leak a score.
items = [
