		{ name = "Stickers", score = 0.2, comment = "Specified as XEP-0449, but Conversations ships no sticker packs.", sources = ["https://xmpp.org/extensions/xep-0449.html", "XEP-0449 \"Stickers\", \"Status Experimental\": \"Publication as an XMPP Extension Protocol does not imply approval of this proposal\""] },
		{ name = "Backups", score = 0.6, comment = "Encrypted .ceb export, run by hand.", sources = ["https://conversations.im/", "\"Dynamic history loading: Conversations will automatically load the message history from your server\": the archive is the server's, and the local export is by hand"] },
