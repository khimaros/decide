#name = "Harness Orchestrator"

# a harness orchestrator is the surface a developer
# drives coding agents from: it launches the harnesses, holds the worktrees,
# shows the diffs, and reaches all of it from a phone. the harnesses
# themselves are compared in the ai-harness topic and appear here only as
# backends.
#
# every source is a primary one: the project's own README, its docs, or a file
# in its repository. a source names the page and the line it was read from, so
# a row can be rechecked without rereading the whole document.
#
# grading a capability by how far it is from working out of the box:
#   1.0 built in, on by default
#   0.7 built in, but off by default or needs configuring
#   0.5 built in, but partial or still landing
#   0.3 only through a plugin, adapter or proxy the project does not ship
#   0.0 not available
#
# every requirement that is graded by a rule instead of by reading carries that
# rule in its own rubric, which the page hands over behind an info button, since
# one candidate's 0.7 and another's rarely mean the same thing. the rules worth
# arguing with are who can steer the project, whether the harness is isolated or
# only the code it writes, what counts as speech at each end of the conversation,
# whether a surface ships or is merely a web page, whether a terminal in the
# product is the reader's own or the harness's, and whether a vendor's relay was
# optional.

requirements = [
	{ name = "Telemetry", priority = -10 },
	{ name = "Vendor Cloud Required", priority = -5, rubric = "1.0 needs a vendor's servers before its own agents can be reached at all. 0.0 needs nothing but your machine and the harness you point it at, and a relay that can be switched off for a direct connection scores as the option it is." },
	{ name = "FOSS", priority = 5 },
	{ name = "Community Run", priority = 10, rubric = "1.0 is a project a volunteer can join: community calls or a public roadmap, and third party contributions landing in it. 0.7 is an open repo that takes pull requests and offers nothing else. a vendor's own roadmap, however public, is not a community." },
	{ name = "Local First", priority = 15 },
	{ name = "Voice: Dictation", priority = 20, rubric = "1.0 speaks into a prompt as part of the product rather than leaning on the operating system. 0.7 dictates but sits outside the product, such as a microphone button that only fills in the prompt box. 0.5 reaches some platforms and not others. 0.0 is an operating system dictation any text box already offers." },
	{ name = "Voice: Speech", priority = 25, rubric = "1.0 reads replies aloud as a mode of its own. a voice that only dials out to a phone number is not this. 0.0 leaves the reading to whatever the operating system offers." },
	{ name = "Voice: Conversation", priority = 30, rubric = "1.0 is hands-free, two-way, and can be interrupted mid-sentence. 0.7 talks back but waits to be asked. a dictation button earns nothing here." },
	{ name = "Git Worktrees", priority = 35 },
	{ name = "Parallel Agents", priority = 40 },
	{ name = "iOS App", priority = 45, rubric = "a surface counts when the project ships it, so a web page laid out for a phone is the browser it opens in and not an app, and an app that drives a different product of the same vendor counts only as the adapter it is." },
	{ name = "Android App", priority = 50, rubric = "a surface counts when the project ships it: an apk or a store build is a build, and a page laid out for a phone is still the browser it opens in." },
	{ name = "Web UI", priority = 55, rubric = "1.0 drives the whole product from a browser, including from a phone. 0.7 is a companion page such as a dashboard next to the real surface. 0.5 can start and stop work but not do it. a marketing site is 0.3." },
	{ name = "Desktop App", priority = 60, rubric = "1.0 ships a windowed app, or a terminal app you can pick windows in. 0.5 is a terminal app that hands you none. a page in a browser is not a desktop app." },
	{ name = "Desktop: Linux", priority = 65, rubric = "1.0 ships a Linux build of the surface a developer works in, and an appimage is a build. 0.5 is a source directory. 0.3 is a Linux build of something else, with the real surface reached another way." },
	{ name = "TUI", priority = 70, rubric = "scored on the interface rather than on there being a terminal somewhere: 1.0 is the product's own screen in a terminal, and you can drive the work from it with no browser and no window. 0.7 is a terminal screen of its own over part of the product while the real surface sits elsewhere. 0.3 is a terminal put to something else's use, a pane or embedded terminal showing the harness's own interface, a window into a sandbox, or a bare command line, which is scored properly under SDK/API. 0.0 offers nothing in the terminal." },
	{ name = "Harness: Claude Code", priority = 75 },
	{ name = "Harness: Codex", priority = 80 },
	{ name = "Harness: OpenCode", priority = 85 },
	{ name = "Harness: Pi", priority = 90 },
	{ name = "Harness: Cursor", priority = 95 },
	{ name = "Harness: ACP", priority = 100, rubric = "scored on whether you can point this at someone else's ACP agent. speaking ACP only between the project's own pieces is worth half, since the standard is adopted but never offered." },
	{ name = "Harness: Any CLI", priority = 105, rubric = "1.0 means naming an executable and having it driven. 0.7 is an editable list of names still held to what the product expects a harness to say. 0.3 is a provider you add by writing code. a compiled-in catalog is 0.3 however long it is." },
	{ name = "Browser Control", priority = 110, rubric = "the browser has to be the product's own and driven for the reader, whether scripted or pointed at pixels. showing the product's own page in a browser, or driving the user's own browser through an extension, is not this." },
	{ name = "Sandboxing", priority = 115, rubric = "1.0 isolates the harness from your machine with something you did not have to build: a container, a vm, a seatbelt or a jail the agent runs inside. 0.7 isolates the code an agent writes but not the agent, and anything you have to install and switch on scores there. permission prompts and allow-lists belong to the harness and score nothing, and a worktree isolates the tree and not the process." },
	{ name = "Terminal Access", priority = 120 },
	{ name = "Diff Review", priority = 125 },
	{ name = "Remote Runtime", priority = 130 },
	{ name = "SDK/API", priority = 135 },
	{ name = "Plugin System", priority = 140 },
	{ name = "GitHub Integration", priority = 145 },
]

