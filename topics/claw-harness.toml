	{ name = "IronClaw", evaluations = [
		{ name = "Account Required", score = 0.0, comment = "near ai is only one of the inference providers onboarding offers; anthropic, openai or a local ollama need no near account", sources = ["https://docs.ironclaw.com/onboard", "\"Inference Provider\": \"In an interactive terminal, onboarding asks which provider and model to use and stores your API key.\"", "https://docs.ironclaw.com/capabilities/llm-providers", "\"Provider Overview\": the table includes \"Ollama | `ollama` | No | Local inference\""] },
