#name = "Claw Harness"

# a claw is an always-on personal assistant in the mould of openclaw: a
# gateway process that answers from chat apps, remembers you between
# sessions, and acts on a schedule without being prompted. the items are the
# notable projects and every rust one from github.com/machinae/awesome-claws.
#
# every row cites a primary source: the project's own documentation, its
# README or its source tree. comparison tables are never a source, including
# the ones these projects publish about each other. a 0.0 cites the most
# complete list the feature would appear in if it existed.
#
# a source names the page and the heading or line it was read from, so a row
# can be rechecked without rereading the whole document.
#
# grading a capability by how far it is from working out of the box:
#   1.0 built in, on by default, or only waiting on the credential it needs
#   0.7 built in, but off by default, behind a build feature, or installed
#       from the project's own add-on branch or registry
#   0.5 built in, but partial or still landing
#   0.3 only through a plugin, adapter or proxy the project does not ship
#   0.0 not available
#
# native sandboxing is isolation the harness sets up itself around the
# commands the agent runs: containers, os sandboxes or wasm. a docker image
# you run the whole gateway in does not count.
#
# heartbeat is the agent waking on its own to check whether anything needs
# doing, as distinct from a cron job somebody wrote.
#
# live canvas is a surface the agent draws and updates for you, beyond chat
# messages. device nodes are paired phones or computers that lend the agent
# their camera, screen, location or local commands.
#
# idle ram is the project's own published figure, since nobody here has
# measured them side by side. where none is published, a node, bun or python
# runtime scores 0.0 and anything else 0.5.
#
# telemetry: 1.0 usage data sent by default, 0.5 only an update check by
# default, 0.0 nothing leaves unless you turn it on.

