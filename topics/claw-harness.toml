		{ name = "Voice: Transcription", score = 0.0, comment = "whisper providers exist in ironclaw_llm but nothing outside that crate calls them; audio attachments are stored untranscribed", sources = ["https://github.com/nearai/ironclaw/blob/main/crates/domains/ironclaw_attachments/src/inbound.rs", "crates/domains/ironclaw_attachments/src/inbound.rs, land_inbound_attachments: \"Images go to the vision model; audio transcription is provider-backed\", and audio leaves extracted_text unset", "https://github.com/nearai/ironclaw/blob/main/crates/domains/ironclaw_threads/src/attachment_context.rs", "crates/domains/ironclaw_threads/src/attachment_context.rs, body_text: \"Audio transcript unavailable.\"", "https://github.com/nearai/ironclaw/blob/main/crates/domains/ironclaw_llm/src/transcription/mod.rs", "crates/domains/ironclaw_llm/src/transcription/mod.rs: \"Audio transcription pipeline.\", with no caller outside ironclaw_llm"] },
