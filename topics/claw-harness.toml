		{ name = "Heartbeat", score = 0.0, comment = "the heartbeat docs page and HEARTBEAT_* env keys are v1 leftovers; no reborn code reads them and the only background scheduler is the trigger poller", sources = ["https://github.com/nearai/ironclaw/blob/main/docs/internal/reborn/contracts/turns-agent-loop.md", "\"## 5. Prompt context\": \"`HEARTBEAT.md` is not part of the default planned or interactive loop prompt prefix; routine, mission, or proactive profiles must own any volatile heartbeat injection semantics\"", "https://docs.ironclaw.com/capabilities/configuration", "\"trigger_poller -- scheduled work\": \"Controls how scheduled and event-driven work is picked up\", and the configuration reference has no heartbeat section"] },
		{ name = "Native Sandboxing", score = 0.7, comment = "wasm extension tools always run in wasmtime, but shell commands run directly on the host in the default local-dev profile; the per-user docker sandbox is an opt-in hosted profile", sources = ["https://docs.ironclaw.com/capabilities/sandboxed-tools", "\"WASM Tools\": \"WASM tools run inside a WebAssembly sandbox powered by [wasmtime](https://wasmtime.dev/).\"", "https://github.com/nearai/ironclaw/blob/main/crates/app/ironclaw_composition/src/deployment.rs", "crates/app/ironclaw_composition/src/deployment.rs, \"/// Standalone deployment on a single-user machine.\": \"requested_profile: RuntimeProfile::LocalHost,\"", "https://github.com/nearai/ironclaw/blob/main/.claude/rules/safety-and-sandbox.md", "\"## Process and shell execution: real OS isolation, per tenant\": \"names the boundary: a process run directly on the host). `HostProcessPort` / `ProcessBackendKind::LocalHost` is for genuinely single-user-local deployments only.\"", "https://github.com/nearai/ironclaw/blob/main/crates/lanes/ironclaw_sandbox/README.md", "README, \"## Production wiring and lifecycle\": \"The `HostedSingleTenantVolumeSandboxed` profile has a production execution backend.\""] },
