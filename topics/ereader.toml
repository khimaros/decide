#name = "eReader"

# the two anti-requirements are the two a spec page never admits to: an
# account standing between you and the device, and a store that only opens
# the books it sold you.
#
# account required: 1.0 will not finish setup without signing in, 0.5 needs
# an account for the store and for nothing else, 0.0 has nothing to sign in
# to. store lock-in: 1.0 reads only what its own store sells, 0.5 ties the
# store's DRM'd books to the vendor but opens anything else, 0.0 has no store
# to be locked to.
#
# screen size scores the reading surface against a 10 inch target: 1.0 at
# 10.2 and up, 0.5 at 7, 0.35 at 6.1, 0.3 at 6. battery scores weeks over
# days: 1.0 for the months Amazon claims, 0.85 for the weeks every other
# reader claims, 0.6 for a fortnight, 0.5 for the days an Android build
# gives you once its frontlight is on.
#
# open source grades the software you actually run: 1.0 would be a system
# rebuildable from published sources, 0.5 is a kernel and a shell under a
# proprietary front end, 0.2 is the vendor's own build of somebody else's
# platform with sources only under pressure, 0.0 is nothing. libre hardware
# grades the drawings instead: 1.0 for board schematics and a bill of
# materials, 0.5 for mechanical drawings and spare parts, 0.0 for a
# certification filing. nothing here clears 0.0, which is why it ranks last
# rather than being deleted.
#
# koreader is a way onto the stock firmware, so it grades one: 1.0 installs
# as an ordinary app or off a memory card, 0.7 waits on a jailbreak the
# current firmware still accepts, 0.2 survives only on firmwares no new
# device ships with, 0.0 has no port. jailbreak available scores the shell on
# its own, because taking an app and giving you root are different offers.
#
# every figure comes from the device's own page, restated in the comment.
# what the page leaves out stays -inf rather than being guessed: nobody
# publishes a replacement cell, and colour temperature is hit or miss in the
# middle of a range.
#
# a source names that page and the spec line it was read from. amazon and
# pocketbook serve their pages only to a real browser, so those rows stay
# uncited rather than sourced to a reseller or a review.
#
# skip = true holds a draft out of the site: the loader drops it and fmt
# leaves it unfilled, so an unchecked candidate cannot leak a score. the two
# left here are the ones whose current spec pages could not be read.
requirements = [
	{ name = "Account Required", priority = -10 },
	{ name = "Store Lock-in", priority = -5 },
	{ name = "USB-C Power", priority = 5 },
	{ name = "Battery", priority = 10 },
	{ name = "Screen Size", priority = 15 },
	{ name = "Open Source", priority = 20 },
	{ name = "KOReader", priority = 25 },
	{ name = "Libre Hardware", priority = 30 },
	{ name = "Jailbreak Available", priority = 35 },
	{ name = "Frontlight: Adjustable Warmth", priority = 40 },
	{ name = "Physical Page Turn Buttons", priority = 45 },
	{ name = "Stylus Notes", priority = 50 },
	{ name = "Screen DPI >= 300", priority = 55 },
	{ name = "Expandable Storage", priority = 60 },
	{ name = "Water Resistance >= IPX8", priority = 65 },
	{ name = "Weight <= 200 g", priority = 70 },
	{ name = "Android Apps", priority = 75 },
	{ name = "Bluetooth Audio", priority = 80 },
	{ name = "Color E Ink" },
	{ name = "Price <= $200" },
	{ name = "Battery Replaceable" },
]

