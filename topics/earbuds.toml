#name = "Earbuds"

# the two anti-requirements are the ones a spec sheet never lists. glued
# battery is why a pair of buds is landfill the day its cell fades, and an
# account is why a pair stops working once the vendor gives up on it.
#
# works without an app: 1.0 pairs and configures from the operating system
# alone, 0.5 plays from the operating system but equaliser, codec choice and
# firmware updates live in the vendor app, 0.0 refuses to pair without one.
#
# codec: aptX Adaptive or LDAC is the grade a listener can hear, since both
# carry far more than SBC. LC3 is better again, but too few buds speak it yet
# to rank on, so it waits unranked below alongside the things nobody has
# measured rather than nobody caring about.
#
# every score comes from the vendor page for that item, and the comment says
# what the page actually claims. a vendor that publishes nothing keeps -inf,
# since latency has to be measured and a repair claim needs a teardown.
#
# a source names that page and the spec line it was read from. earfun, sony
# and soundcore serve their spec pages only to a real browser, so their rows
# stay uncited rather than sourced to a reseller or a review.

requirements = [
	{ name = "Glued Battery", priority = -10 },
	{ name = "Account Required", priority = -5 },
	{ name = "USB-C Power", priority = 5 },
	{ name = "Battery Life: Buds >= 4h", priority = 10 },
	{ name = "Battery Life: Case >= 20h", priority = 15 },
	{ name = "Works Without an App", priority = 20 },
	{ name = "Bluetooth 5.0", priority = 25 },
	{ name = "Codec: aptX Adaptive or LDAC", priority = 30 },
	{ name = "Multipoint Pairing", priority = 35 },
	{ name = "Water Resistance >= IPX4", priority = 40 },
	{ name = "Physical Volume Controls", priority = 45 },
	{ name = "Price <= $120", priority = 50 },
	{ name = "Active Noise Cancellation" },
	{ name = "Codec: LC3" },
	{ name = "Latency <= 100ms" },
	{ name = "Qi Wireless Charging" },
	{ name = "Transparency Mode" },
]

